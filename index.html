<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Autonomous Dance Skeleton</title><link rel="stylesheet" href="/src/style.css"/></head>
<body><main id="stage"><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas><div id="notice">CAMERA OFF — Start Camera to begin</div><button id="showControls" hidden>SHOW ☰</button>
<aside id="panel" class="controls-panel"><header class="controls-header"><h1 class="logo"><span>AUTONOMOUS</span><em>DANCE</em></h1><button id="hide">HIDE ×</button></header><div id="controlsScroll" class="controls-scroll" tabindex="0"><output id="poseStatus">CAMERA: OFF | MEDIAPIPE: IDLE | POSE: NOT DETECTED | LANDMARKS: 0</output>
<details open><summary>CAMERA</summary><div class="section"><button id="camera">START CAMERA</button><label><input id="mirror" type="checkbox" checked/> Mirror</label><label>Display <select id="display"><option value="live">Live video + character</option><option value="silhouette">Silhouette + character</option><option value="character">Character only</option><option value="dark">Dark background</option></select></label></div></details>
<details open><summary>FACE</summary><div class="section"><label class="upload">Drop / choose faces<input id="faces" type="file" accept="image/png,image/jpeg,image/webp" multiple/></label><label>Face <select id="faceSelect"><option value="-1">Default orb</option></select></label><label><input id="randomFace" type="checkbox"/> Random at performance start</label><label>Scale <input id="faceScale" type="range" min=".3" max="2.5" step=".05" value="1"/></label><label>Offset X <input id="faceX" type="range" min="-100" max="100" value="0"/></label><label>Offset Y <input id="faceY" type="range" min="-100" max="100" value="0"/></label></div></details>
<details open><summary>PERFORMANCE</summary><div class="section"><div class="buttons"><button data-state="FOLLOW">FOLLOW</button><button data-state="DRIFT">DRIFT</button><button data-state="DETACH">DETACH</button><button data-state="AUTONOMOUS">DANCE</button><button data-state="RETURN">RETURN</button></div><label><input id="auto" type="checkbox"/> Enable Auto Performance</label><label>Follow duration <input id="followDuration" type="number" min="0" max="300" value="10"/> sec</label><label>Transition duration <input id="transitionDuration" type="number" min="0" max="60" value="5"/> sec</label><label>Detach direction <select id="direction"><option value="right">Right</option><option value="left">Left</option><option value="up">Up</option></select></label><label>Detach distance <input id="distance" type="range" min="30" max="500" value="230"/></label></div></details>
<details><summary>DANCE</summary><div class="section"><label>Style <select id="genre"><option>AUTO</option><option>HOUSE</option><option>HIP-HOP</option><option>JAZZ</option><option>BREAKING</option><option>FUNK / DISCO</option><option>CONTEMPORARY</option></select></label><label>Intensity <input id="intensity" type="range" min=".2" max="2" step=".1" value="1"/></label><label>Music reactivity <input id="reactivity" type="range" min="0" max="1" step=".05" value=".55"/></label></div></details>
<details><summary>AUDIO</summary><div class="section"><div class="microw"><button id="mic">MIC OFF</button><output id="bpmStatus">BPM: --</output></div><label><input id="bpmAuto" type="checkbox" checked/> BPM auto</label><label>Manual BPM <input id="bpm" type="range" min="60" max="180" value="124"/><output id="bpmOut">124</output></label></div></details>
<details><summary>VISUAL</summary><div class="section"><div class="toggleRow"><span>Body</span><button class="toggle active" id="bodyToggle" aria-pressed="true">ON</button><span>Face</span><button class="toggle active" id="faceToggle" aria-pressed="true">ON</button></div><p class="paletteLabel">SKELETON COLOR</p><div class="palette" id="skeletonPalette"></div><p class="paletteLabel">FACE COLOR</p><div class="palette" id="facePalette"></div><label>Line width <input id="line" type="range" min="2" max="18" value="7"/></label><label><input id="trail" type="checkbox" checked/> Trail</label><label><input id="debug" type="checkbox"/> Debug</label><button id="fullscreen">FULLSCREEN</button></div></details><footer id="stats">FPS — · BPM 124 · FOLLOW</footer></div></aside></main><script type="module" src="/src/main.js"></script></body></html>
